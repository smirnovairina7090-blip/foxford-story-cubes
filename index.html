:root{font-family:Arial,Helvetica,sans-serif;color:#25262c;background:#fcfcfb;font-synthesis:none;--focus:#bb6e00}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible{outline:3px solid var(--focus);outline-offset:5px}svg{display:block;width:100%;height:100%}.page-shell{width:min(1280px,100%);min-height:100svh;margin:auto;padding:56px 48px;display:flex;flex-direction:column;justify-content:center}.intro{text-align:center}.intro h1{font-size:58px;line-height:1.1;letter-spacing:-2.3px;font-weight:500;margin:0 0 22px}.intro p{font-size:17px;line-height:1.7;color:#70736b;margin:0 auto;max-width:650px}.intro strong{font-weight:600;color:#453b32}.game{margin:56px 0 38px}.dice-stage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:23px;padding:0 5px;perspective:1000px}.cube-wrap{position:relative;padding-bottom:10px;min-width:0;--cube-bg:#e6eddf;--cube-edge:#d0ddc3;--tilt:-1deg}.cube-wrap:nth-child(2){--cube-bg:#f4dad2;--cube-edge:#e8c2b6;--tilt:1.5deg}.cube-wrap:nth-child(3){--cube-bg:#e1d4f7;--cube-edge:#cebbea;--tilt:-1deg}.cube-wrap:nth-child(4){--cube-bg:#dce6f3;--cube-edge:#bfd0e6;--tilt:1.5deg}.cube-wrap:nth-child(5){--cube-bg:#fff0d6;--cube-edge:#f1dbb7;--tilt:-1.2deg}.cube{height:200px;width:100%;background:var(--cube-bg);border:1px solid #25262c20;border-radius:21px;position:relative;box-shadow:0 8px 0 var(--cube-edge),0 9px 0 #30443126,0 17px 23px -17px #74806e80;transition:transform .2s,box-shadow .2s;transform:rotate(var(--tilt))}.cube:hover{transform:translateY(-3px) rotate(0)}.cube-wrap.locked .cube{box-shadow:0 8px 0 var(--cube-edge),0 9px 0 #30443126,0 0 0 2px #537e6040}.picture-button{position:absolute;inset:0;background:none;border-radius:21px;display:flex;align-items:center;justify-content:center;padding:31px 24px 35px;width:100%}.picture-button svg{max-width:135px;max-height:135px;filter:drop-shadow(0 3px 0 #3343310a);transition:transform .2s}.picture-button:hover svg{transform:scale(1.04)}.lock-button{position:absolute;top:11px;right:11px;border-radius:50%;width:28px;height:28px;padding:6px;background:#ffffff59;color:#6d7d68;transition:background .2s,color .2s}.lock-button:hover{background:#fffaf0}.lock-button[aria-pressed=true]{background:#5b8e5e;color:#fffaf0}.cube-number{position:absolute;bottom:14px;left:17px;font-size:10px;letter-spacing:1px;color:#707365;pointer-events:none}.cube-name{text-align:center;font-size:15px;font-weight:500;margin-top:23px;line-height:20px;min-height:20px;color:#35373d}.action-area{display:flex;justify-content:center}
.roll-button{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-width:218px;min-height:57px;padding:15px 30px;border-radius:18px;
  font-size:16px;font-weight:700;color:#44210f;border:1px solid #df841a;
  background:linear-gradient(165deg,#ffcf68,#ffab34 53%,#ff8d1c);
  box-shadow:0 5px 0 #bf6b15,0 12px 23px -9px #b664078c,inset 0 1px 0 #fff2cf;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
.roll-button::before{
  content:"";position:absolute;inset:0 auto 0 -45%;width:35%;
  background:linear-gradient(90deg,transparent,#fff3cdbd,transparent);
  transform:skewX(-22deg);pointer-events:none;
}
.roll-button .roll-spark{position:relative;width:27px;height:27px;flex:none}
.roll-button #roll-text{position:relative}
.roll-button:hover:enabled{filter:brightness(1.05);box-shadow:0 7px 0 #bf6b15,0 16px 24px -9px #b6640799,inset 0 1px 0 #fff2cf}
.roll-button:active:enabled,.roll-button.is-rolling{box-shadow:0 2px 0 #bf6b15,0 8px 18px -8px #b6640777,inset 0 1px 0 #fff2cf}
.roll-button:disabled:not(.is-rolling){background:#ead4b2;border-color:#d2b992;color:#746552;box-shadow:0 4px 0 #c6af8d}
.roll-button:disabled:not(.is-rolling) .roll-spark{opacity:.5}
@media(prefers-reduced-motion:no-preference){
  body:not(.no-animation) .roll-button:hover:enabled{transform:translateY(-2px)}
  body:not(.no-animation) .roll-button:active:enabled,
  body:not(.no-animation) .roll-button.is-rolling{transform:translateY(3px)}
  body:not(.no-animation) .roll-button:hover:enabled::before{animation:roll-glint .62s ease-out}
  body:not(.no-animation) .roll-button.is-rolling::before{animation:roll-glint .58s ease-out}
  body:not(.no-animation) .roll-button.is-rolling .roll-spark{animation:roll-spark .6s ease-out}
}
@keyframes roll-glint{to{left:118%}}
@keyframes roll-spark{35%{transform:scale(1.25) rotate(-13deg);filter:drop-shadow(0 0 5px #fff0ac)}}
.rolling .cube{animation:tumble .68s cubic-bezier(.3,.1,.3,1);pointer-events:none;animation-delay:var(--delay,0ms)}.rolling .picture-button svg{animation:art-flash .5s;animation-delay:var(--delay,0ms)}.cube-wrap.locked .cube,.cube-wrap.locked .picture-button svg{animation:none}@keyframes tumble{0%,100%{transform:rotate(var(--tilt)) translateY(0)}24%{transform:translateY(-28px) rotate(-9deg) rotateY(22deg)}55%{transform:translateY(-10px) rotate(8deg) rotateY(-20deg)}80%{transform:translateY(2px) rotate(-3deg)}}@keyframes art-flash{0%,100%{opacity:1}40%{opacity:.2;transform:scale(.7) rotate(-15deg)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:701px) and (max-height:750px){.page-shell{padding-top:35px;padding-bottom:35px}.intro h1{font-size:49px;margin-bottom:16px}.intro p{font-size:15px}.game{margin-top:40px;margin-bottom:28px}.cube{height:175px}.picture-button svg{max-height:115px;max-width:115px}}@media(max-width:1000px){.page-shell{padding-right:30px;padding-left:30px}.dice-stage{gap:17px}.cube{height:175px}.picture-button{padding:30px 16px 32px}.cube-name{font-size:13px}.intro h1{font-size:51px}}@media(max-width:700px){.page-shell{padding:36px 22px 40px}.intro h1{font-size:40px;letter-spacing:-1.8px;margin-bottom:19px}.intro p{font-size:14px;line-height:1.7;max-width:350px}.game{margin:40px 0 27px}.dice-stage{grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 14px;max-width:490px;margin:auto;padding:0 3px}.cube-wrap{grid-column:span 2}.cube-wrap:nth-child(4){grid-column:2/span 2}.cube-wrap:nth-child(5){grid-column:4/span 2}.cube{height:auto;aspect-ratio:1/1.06;border-radius:17px}.picture-button{padding:23px 13px 25px;border-radius:17px}.lock-button{width:25px;height:25px;padding:6px;top:8px;right:8px}.cube-number{font-size:8px;bottom:11px;left:12px}.cube-name{font-size:12px;margin-top:17px;line-height:16px;min-height:16px}.roll-button{font-size:15px;min-height:53px;padding:15px 26px}}@media(max-width:370px){.page-shell{padding-right:15px;padding-left:15px}.intro h1{font-size:35px}.intro p{font-size:12px}.cube-name{font-size:10px}.picture-button{padding-right:10px;padding-left:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

let draft=null,draftDecks=null,settingsTab='game',formNotice='',uploadBusy=false;
function dt(key,values={}){return phrase(draft?.lang||config.lang,key,values);}
function segmented(key,choices){return `<div class="segmented ${key==='level'?'level-options':''}">${choices.map(([value,label])=>`<label class="segment"><input type="radio" name="${key}" data-setting="${key}" value="${esc(value)}" ${String(draft[key])===String(value)?'checked':''}><span>${esc(label)}</span></label>`).join('')}</div>`;}
function settingToggle(key){const disabled=key==='translation'&&draft.lang!=='en'||key==='autoTimer'&&!draft.seconds;return `<label class="setting-toggle ${disabled?'is-disabled':''}"><span><strong>${esc(dt(key))}</strong><small>${esc(dt(key+'Hint'))}</small></span><input type="checkbox" data-setting="${key}" ${draft[key]?'checked':''} ${disabled?'disabled':''}><span class="toggle-track" aria-hidden="true"></span></label>`;}
function miniArt(card){if(card.image)return `<img src="${esc(card.image)}" alt="">`;if(card.art&&artById[card.art])return artById[card.art];return `<span class="mini-word">${esc(cardName(card,draft.lang))}</span>`;}
function editorContent(){const rows=draftDecks[draft.level];let content=`<fieldset class="settings-field"><legend>${esc(dt('difficulty'))}</legend>${segmented('level',levels.map(value=>[value,dt(value)]))}</fieldset><fieldset class="settings-field"><legend>${esc(dt('source'))}</legend>${segmented('source',[['builtin',dt('builtin')],['custom',dt('custom')]])}</fieldset>`;
if(draft.source==='builtin'){content+=`<div class="bank-heading"><strong>${esc(dt(draft.level))}</strong><span class="bank-count">36 ${esc(dt('cards'))}</span></div><p class="settings-hint">${esc(dt('bankHint'))}</p><div class="bank-preview">${builtInDecks[draft.level].map(card=>`<figure><div>${miniArt(card)}</div><figcaption>${esc(cardName(card,draft.lang))}</figcaption></figure>`).join('')}</div><button class="secondary-button full-width" data-action="seed">${esc(dt('seed'))}</button><div class="backup-tools"><button class="secondary-button" data-action="import">${esc(dt('import'))}</button></div><p class="settings-hint small">${esc(dt('backupHint'))}</p>`;return content;}
content+=`<div class="bank-heading"><strong>${esc(dt('editorTitle'))}</strong><span class="bank-count">${rows.length} / 120</span></div><p class="settings-hint">${esc(dt('customHelp'))}<br>${esc(dt('minimum',{n:draft.count}))}</p><div class="deck-tools"><button class="secondary-button" data-action="seed">${esc(dt(rows.length?'seedAgain':'seed'))}</button><button class="secondary-button" data-action="upload" ${uploadBusy?'disabled':''}>${esc(dt(uploadBusy?'loading':'upload'))}</button></div><p class="settings-hint small">${esc(dt('uploadHint'))}</p><div class="word-adder"><h3>${esc(dt('newWord'))}</h3><div class="word-fields"><input id="add-ru" maxlength="60" placeholder="${esc(dt('ruWord'))}" aria-label="${esc(dt('ruWord'))}"><input id="add-en" maxlength="60" placeholder="${esc(dt('enWord'))}" aria-label="${esc(dt('enWord'))}"><button class="small-add" data-action="add-word">${esc(dt('add'))}</button></div></div><div class="custom-card-list">${rows.length?rows.map((card,i)=>`<div class="custom-card-row"><div class="custom-thumbnail">${miniArt(card)}</div><div class="custom-fields"><label><span>RU</span><input data-card="${esc(card.id)}" data-field="ru" value="${esc(card.ru)}" maxlength="60" aria-label="${esc(dt('ruWord'))} ${i+1}"></label><label><span>EN</span><input data-card="${esc(card.id)}" data-field="en" value="${esc(card.en)}" maxlength="60" aria-label="${esc(dt('enWord'))} ${i+1}"></label></div><button class="delete-card" data-action="delete" data-card="${esc(card.id)}" aria-label="${esc(dt('delete'))} ${i+1}" title="${esc(dt('delete'))}">×</button></div>`).join(''):`<p class="empty-deck">${esc(dt('empty'))}</p>`}</div><div class="backup-tools"><button class="secondary-button" data-action="export">${esc(dt('export'))}</button><button class="secondary-button" data-action="import">${esc(dt('import'))}</button></div><p class="settings-hint small">${esc(dt('backupHint'))}</p>`;return content;}
function renderSettings(){
  dialog.lang=draft.lang;
  const deckSize=draft.source==='custom'?draftDecks[draft.level].length:builtInDecks[draft.level].length;
  const deckSizeLabel=dt(draft.lang==='en'&&deckSize===1?'oneCard':'levelSummary',{n:deckSize});
  const game=`<fieldset class="settings-field"><legend>${esc(dt('language'))}</legend>${segmented('lang',[['ru','Русский'],['en','English']])}</fieldset><fieldset class="settings-field"><legend>${esc(dt('difficulty'))}</legend>${segmented('level',levels.map(value=>[value,dt(value)]))}<p class="settings-hint">${esc(dt(draft.level+'Desc'))} · ${esc(deckSizeLabel)}</p></fieldset><fieldset class="settings-field"><legend>${esc(dt('cubeCount'))}</legend>${segmented('count',[[3,'3'],[5,'5'],[9,'9']])}</fieldset><fieldset class="settings-field"><legend><label for="story-time">${esc(dt('storyTime'))}</label></legend><select id="story-time" data-setting="seconds">${[0,15,30,45,60,90,120].map(value=>`<option value="${value}" ${draft.seconds===value?'selected':''}>${value?value+' '+esc(dt('seconds')):esc(dt('noTimer'))}</option>`).join('')}</select></fieldset><fieldset class="settings-field"><legend>${esc(dt('source'))}</legend>${segmented('source',[['builtin',dt('builtin')],['custom',dt('custom')]])}<p class="settings-hint">${esc(deckSizeLabel)}</p></fieldset><div class="toggle-group">${['labels','translation','noRepeat','randomTasks','fox','animations','autoTimer'].map(settingToggle).join('')}</div><button class="reset-settings" data-action="reset">${esc(dt('reset'))}</button><p class="settings-hint small">${esc(dt('savedHere'))}</p>`;
dialog.innerHTML=`<div class="settings-head"><div><span class="settings-kicker">${esc(dt('title'))}</span><h2 id="settings-title">${esc(dt('settings'))}</h2></div><button class="close-settings" data-action="cancel" aria-label="${esc(dt('close'))}">${icon('close')}</button></div><div class="settings-tabs" role="tablist" aria-label="${esc(dt('settings'))}"><button role="tab" aria-selected="${settingsTab==='game'}" data-tab="game">${esc(dt('gameTab'))}</button><button role="tab" aria-selected="${settingsTab==='cards'}" data-tab="cards">${esc(dt('cardsTab'))}</button></div><div class="settings-body" role="tabpanel">${settingsTab==='game'?game:editorContent()}</div><div class="settings-footer"><p class="settings-message" id="settings-message" role="status">${esc(formNotice)}</p><div><button class="settings-cancel" data-action="cancel">${esc(dt('cancel'))}</button><button class="settings-apply" data-action="apply" ${uploadBusy?'disabled':''}>${esc(dt('apply'))}</button></div></div>`;}
function openSettings(){if(busy)return;pauseTimer();draft={...config};draftDecks=structuredClone(customDecks);formNotice='';settingsTab='game';renderSettings();dialog.showModal();}
$('settings-open').addEventListener('click',openSettings);
function panelMessage(text){formNotice=text;const node=$('settings-message');if(node)node.textContent=text;}
function applySettings(){const next=normalizeSettings(draft),clean=cleanCustom(draftDecks,knownArt),bank=next.source==='custom'?clean[next.level]:builtInDecks[next.level];if(bank.length<next.count){panelMessage(dt('needMore',{have:bank.length,need:next.count}));return;}const oldKey=config.level+'|'+config.source+'|'+config.count,oldIds=deck.map(card=>card.id).join('|');config=next;customDecks=clean;setDeck();const reseed=oldKey!==config.level+'|'+config.source+'|'+config.count||oldIds!==deck.map(card=>card.id).join('|');if(reseed){used=new Set();selected=drawFromDeck(deck,config.count,new Set(),used,config.noRepeat);locked=selected.map(()=>false);}else used=new Set([...used].filter(id=>byId.has(id)));taskIndex=0;resetTimer();localizeMain();render();announce();dialog.close();persist();showFox();}
function seedDeck(){const current=draftDecks[draft.level],existing=new Set(current.map(card=>card.art).filter(Boolean));const add=builtInDecks[draft.level].filter(card=>!existing.has(card.art));if(current.length+add.length>120){panelMessage(dt('limit'));return;}current.push(...add.map(card=>({...card,id:newId()})));draft.source='custom';formNotice='';renderSettings();}
function addWord(){const ru=$('add-ru').value.trim(),en=$('add-en').value.trim();if(!ru&&!en){panelMessage(dt('needWords'));return;}if(draftDecks[draft.level].length>=120){panelMessage(dt('limit'));return;}draftDecks[draft.level].push({id:newId(),ru:ru||en,en:en||ru});formNotice='';renderSettings();$('add-ru')?.focus();}
function exportDeck(){const payload={version:1,decks:cleanCustom(draftDecks,knownArt)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='story-dice-custom-decks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);panelMessage(dt('deckExported'));}
dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close();return;}const tab=event.target.closest('[data-tab]');if(tab){settingsTab=tab.dataset.tab;formNotice='';renderSettings();return;}const button=event.target.closest('[data-action]');if(!button)return;switch(button.dataset.action){case'cancel':dialog.close();break;case'apply':applySettings();break;case'reset':draft={...defaults};formNotice='';renderSettings();break;case'seed':seedDeck();break;case'add-word':addWord();break;case'delete':draftDecks[draft.level]=draftDecks[draft.level].filter(card=>card.id!==button.dataset.card);renderSettings();break;case'upload':$('custom-image-input').click();break;case'export':exportDeck();break;case'import':$('deck-import-input').click();break;}});
dialog.addEventListener('change',event=>{const key=event.target.dataset.setting;if(!key)return;draft[key]=event.target.type==='checkbox'?event.target.checked:['count','seconds'].includes(key)?Number(event.target.value):event.target.value;formNotice='';renderSettings();});
dialog.addEventListener('input',event=>{const {card,field}=event.target.dataset;if(card&&['ru','en'].includes(field)){const target=draftDecks[draft.level].find(item=>item.id===card);if(target)target[field]=event.target.value.slice(0,60);}});
dialog.addEventListener('keydown',event=>{if(event.key==='Enter'&&['add-ru','add-en'].includes(event.target.id)){event.preventDefault();addWord();}});
async function imageData(file){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10*1024*1024)throw new Error('format');const bitmap=await createImageBitmap(file);const scale=Math.min(1,256/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext('2d');context.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/webp',.86);}
$('custom-image-input').addEventListener('change',async event=>{if(!draft)return;const files=[...event.target.files];event.target.value='';if(!files.length)return;const targetLevel=draft.level,room=120-draftDecks[targetLevel].length;if(files.length>room){panelMessage(dt('limit'));return;}uploadBusy=true;renderSettings();let failures=0;for(const file of files){try{const image=await imageData(file);const name=file.name.replace(/\.[^.]+$/,'').slice(0,60)||dt('newImage');draftDecks[targetLevel].push({id:newId(),ru:name,en:name,image});}catch{failures++;}}uploadBusy=false;formNotice=failures?dt('imageError'):'';renderSettings();});
$('deck-import-input').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file||!draft)return;try{if(file.size>12*1024*1024)throw new Error('large');const data=JSON.parse(await file.text());if(data.version!==1||!data.decks)throw new Error('version');const clean=cleanCustom(data.decks,knownArt);if(!levels.some(level=>clean[level].length))throw new Error('empty');draftDecks=clean;if(!draftDecks[draft.level].length)draft.level=levels.find(level=>draftDecks[level].length);draft.source='custom';settingsTab='cards';formNotice=dt('deckImported');renderSettings();}catch{panelMessage(dt('badFile'));}});
localizeMain();render();announce();showFox();

})();
</script>
</body>
